<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northstar Coffee Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<div class="auth-shell">
  <section class="auth-brand">
    <p class="eyebrow">Northstar Coffee</p>
    <h1>Authentication and Role-Based Access</h1>
    <p>Login information is checked by the Flask API against MongoDB.</p>
    <div class="flow">
      <span>Login Form</span><span>→</span><span>Flask API</span><span>→</span>
      <span>MongoDB</span><span>→</span><span>Role Check</span>
    </div>
  </section>

  <section class="auth-card">
    <div class="logo">NC</div>
    <h2>Sign In</h2>
    <p class="muted">Use your account to continue.</p>

    <form id="loginForm">
      <label>Email
        <input id="email" type="email" required>
      </label>
      <label>Password
        <input id="password" type="password" required>
      </label>
      <button type="submit" class="primary">Login</button>
    </form>

    <p id="message" class="message"></p>

    <div class="demo-box">
      <strong>Class Demo Accounts</strong>
      <p>User: user@coffee.local / User123!</p>
      <p>Admin: admin@coffee.local / Admin123!</p>
    </div>
  </section>
</div>
<script src="login.js"></script>
</body>
</html>
